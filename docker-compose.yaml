name: argilla-stack

x-common-variables: &common-variables
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-argilla}
  ARGILLA_REDIS_URL: redis://redis:6379/0
  HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}

services:
  argilla:
    image: argilla/argilla-server:${ARGILLA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${ARGILLA_PORT:-6900}:6900"
    environment:
      <<: *common-variables
      USERNAME: ${ARGILLA_USER:-argilla}
      PASSWORD: ${ARGILLA_PASSWORD:-12345678}
      API_KEY: ${ARGILLA_API_KEY:-argilla.apikey}
      WORKSPACE: ${ARGILLA_WORKSPACE:-default}
    volumes:
      - argilladata:/var/lib/argilla
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6900/api/v1/version')\" || curl -f http://localhost:6900/api/v1/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - argilla-net

  worker:
    image: argilla/argilla-server:${ARGILLA_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *common-variables
      BACKGROUND_NUM_WORKERS: ${BACKGROUND_NUM_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'
    networks:
      - argilla-net

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-argilla}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-argilla}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - argilla-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m} -XX:UseSVE=0
      - CLI_JAVA_OPTS=-XX:UseSVE=0
      - node.name=elasticsearch
      - cluster.name=es-argilla-local
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticdata:/usr/share/elasticsearch/data/
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - argilla-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - argilla-net

networks:
  argilla-net:
    driver: bridge

volumes:
  argilladata:
  elasticdata:
  postgresdata:
  redisdata:
